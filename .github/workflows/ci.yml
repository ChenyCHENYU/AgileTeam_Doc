name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Content freshness check
        run: bun scripts/check-freshness.mjs

      - name: Embedding security policy check
        run: bun run test

      - name: Build docs
        run: bun run build
